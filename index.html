<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compte à rebours</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">Compte à rebours</p>
      <h1>Temps restant avant une date</h1>
      <p class="subtitle">
        Entre une date et visualise le temps restant en jours, heures, minutes et secondes.
      </p>

      <p class="subtitle">
        Compte à rebours jusqu’au 30 avril 2026 à 05:30 (GMT+8)
      </p>


      <div id="message" class="message"></div>

      <section class="countdown" id="countdown">
        <div class="time-box">
          <span id="days">0</span>
          <small>Jours</small>
        </div>
        <div class="time-box">
          <span id="hours">0</span>
          <small>Heures</small>
        </div>
        <div class="time-box">
          <span id="minutes">0</span>
          <small>Minutes</small>
        </div>
        <div class="time-box">
          <span id="seconds">0</span>
          <small>Secondes</small>
        </div>
      </section>

      <p id="timezone-info"></p>
    </section>


  </main>

  <script src="script.js"></script>
</body>
</html>
